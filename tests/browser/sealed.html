<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>suite: sealed build</title></head>
<body>
<pre id="log">running</pre>
<iframe id="app" style="width:900px;height:600px"></iframe>
<script src="/harness/harness.js"></script>
<script>
/* A build deployed with a sealed config: what it does before anyone has
   typed the password, what it does with a wrong one, what it holds once
   it is open, and what staying signed in on a machine saves, opens with
   and gives back. Served with a config sealed under "letmein" around
   host 127.0.0.1:1 (a port nothing answers, so the connection attempt
   fails fast) and key "super-secret-psk". */

run(async () => {
  const a = app(document.getElementById('app'));

  // A browser that used this origin as an ordinary console beforehand,
  // and that was never told to stay signed in.
  localStorage.clear();
  localStorage.setItem('bravia-console-config',
    JSON.stringify({ host: '10.9.9.9', psk: 'stale-old-key', interval: 3 }));
  await a.load('/index.html');

  await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open, 'the lock');
  ok('starts at the unlock prompt', a.$('unlock-dialog').open);
  ok('settings dialog stays shut while locked', !a.$('settings-dialog').open);
  ok('empty state hidden while locked', a.$('empty-state').hidden);
  ok('no config yet', a.read('cfg') === null);
  ok('locked flag set', a.read('locked') === true);
  // The cards this deployment leaves out are still in the document while
  // it is locked: the config that names them has not been opened yet.
  ok('every card is present before the config is opened',
     !!a.$('card-apps') && !!a.$('card-sound') && !!a.$('card-power'));
  ok('a leftover stored config is purged at boot',
     localStorage.getItem('bravia-console-config') === null,
     localStorage.getItem('bravia-console-config'));

  /* Ways out of the lock that must not exist. */
  a.fire('unlock-dialog', 'cancel');
  await sleep(50);
  ok('Esc cannot dismiss the lock', a.$('unlock-dialog').open);
  watchErrors(a);
  a.$('unlock-dialog').close();          // whatever route a close request takes
  // Either the prompt comes straight back or the page reloads into a
  // locked one. Both are the lock holding; waiting covers both.
  const lockHeld = () => { const d = a.$('unlock-dialog'); return !!(d && d.open); };
  await waitFor(lockHeld, 'the lock to come back after a close');
  ok('a closed lock comes back', lockHeld(), 'locked=' + a.read('locked'));
  a.$('btn-settings').click();
  await sleep(100);
  ok('settings unreachable while locked', !a.$('settings-dialog').open);
  a.read('openSettings("forced")');
  await sleep(50);
  ok('openSettings is inert while locked', !a.$('settings-dialog').open);

  /* Returning to the tab must not paint a failure over the prompt. */
  const pillBefore = a.$('conn-pill').textContent;
  a.read('pollOnce(true)');
  await sleep(300);
  ok('polling is a no-op with no config', a.$('conn-pill').textContent === pillBefore,
     pillBefore + ' became ' + a.$('conn-pill').textContent);

  /* ── a wrong password ─────────────────────────────────────────────── */
  a.$('unlock-password').value = 'wrong-one';
  a.fire('unlock-form', 'submit');
  await waitFor(() => !a.$('unlock-error').hidden, 'the denial');
  ok('access denied shown', a.$('unlock-error').textContent === 'Access denied.',
     a.$('unlock-error').textContent);
  ok('still locked after a wrong password', a.$('unlock-dialog').open && a.read('cfg') === null);
  ok('password field cleared after failure', a.$('unlock-password').value === '');
  ok('nothing connected', a.read('getPsk()') === '');

  a.$('unlock-password').value = '';
  a.fire('unlock-form', 'submit');
  await sleep(150);
  ok('empty password is refused', /Enter the password/.test(a.$('unlock-error').textContent));

  /* ── the right password ───────────────────────────────────────────── */
  a.$('unlock-password').value = 'letmein';
  a.fire('unlock-form', 'submit');
  await waitFor(() => a.read('cfg') !== null, 'the unlock');
  ok('unlock dialog closed', !a.$('unlock-dialog').open);
  await sleep(200);
  ok('unlock dialog stays closed', !a.$('unlock-dialog').open);
  ok('host taken from the sealed config', a.read('cfg').host === '127.0.0.1:1',
     JSON.stringify(a.read('cfg')));
  ok('interval taken from the sealed config', a.read('cfg').interval === 7);
  ok('locked flag cleared', a.read('locked') === false);
  ok('key recovered', a.read('getPsk()') === 'super-secret-psk');
  ok('cfg does not carry the key', a.read('JSON.stringify(cfg)').indexOf('psk') === -1);
  ok('password field cleared after success', a.$('unlock-password').value === '');

  /* ── the key is masked in memory ──────────────────────────────────── */
  ok('stored bytes are not the key',
     a.read('new TextDecoder().decode(pskMasked)') !== 'super-secret-psk');
  ok('mask matches the key in length',
     a.read('pskMask.length') === 16 && a.read('pskMasked.length') === 16);
  ok('mask is not all zeroes', a.read('pskMask.some(b => b !== 0)') === true);

  /* ── cards the deployment leaves out ──────────────────────────────── */
  /* Sealed with hiddenCards ['apps', 'sound', 'not-a-card']. */
  ok('a card the config names is gone from the document', a.$('card-apps') === null);
  ok('and so is the second one', a.$('card-sound') === null);
  ok('cards it did not name are untouched',
     !!a.$('card-power') && !!a.$('card-inputs') && !!a.$('card-keys') && !!a.$('card-system'));
  ok('a name matching no card is passed over rather than refusing the config',
     a.read('cfg') !== null && a.$('card-power') !== null);
  // Every renderer looks its card up by id, so the ones whose card has gone
  // must return rather than throw. Called directly, because the display this
  // suite points at answers nothing and a poll would never reach them.
  let renderThrew = '';
  try {
    a.read('renderApps(); renderTextCard(null); renderVolume(null); renderSystem(null); ' +
           'applyStandbyMask(); loadGenericSettings("audio", "getSoundSettings", ' +
           '"setSoundSettings", "card-sound", "sound-body");');
  } catch (e) { renderThrew = (e && e.message) || String(e); }
  ok('the renderers pass over a card that is gone', renderThrew === '', renderThrew);

  /* ── nothing durable was written ──────────────────────────────────── */
  const stores = a.read(
    'JSON.stringify({ls: {...localStorage}, ss: {...sessionStorage}, ck: document.cookie})');
  ok('neither address nor key reached storage',
     stores.indexOf('super-secret-psk') === -1 && stores.indexOf('127.0.0.1:1') === -1, stores);
  ok('no config key at all', a.read('localStorage.getItem("bravia-console-config")') === null);

  /* ── settings in a deployed build ─────────────────────────────────── */
  a.$('btn-settings').click();
  await waitFor(() => a.$('settings-dialog').open, 'settings');
  ok('address and key fields hidden', a.$('settings-connection').hidden);
  ok('deployment note shown', !a.$('deploy-note').hidden);
  ok('the note says the session ends with the tab', !a.$('deploy-session-note').hidden);
  ok('no stay-signed-in note when nothing is saved', a.$('deploy-remembered-note').hidden);
  ok('logout button shown', !a.$('btn-logout').hidden);
  ok('save button says what it does', a.$('btn-cfg-save').textContent === 'Save',
     a.$('btn-cfg-save').textContent);
  ok('interval still editable', a.$('cfg-interval').value === '7' && !a.$('cfg-interval').disabled);
  ok('key not echoed into the form', a.$('cfg-psk').value === '');

  a.$('cfg-interval').value = '12';
  a.fire('settings-form', 'submit');
  await waitFor(() => a.read('cfg').interval === 12, 'the interval edit');
  ok('interval applied', a.read('cfg').interval === 12);
  ok('interval remembered', a.read('localStorage.getItem("bravia-console-interval")') === '12');
  ok('an interval edit writes no key',
     a.read('JSON.stringify({...localStorage})').indexOf('super-secret-psk') === -1);
  ok('connection unchanged by an interval edit', a.read('getPsk()') === 'super-secret-psk');

  /* ── logout ───────────────────────────────────────────────────────── */
  a.$('btn-settings').click();
  await waitFor(() => a.$('settings-dialog').open, 'settings again');
  a.$('btn-logout').click();
  await sleep(300);
  await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open && a.read('cfg') === null,
                'the page to come back locked');
  ok('logout returns to the lock', a.$('unlock-dialog').open && a.read('cfg') === null);
  ok('logout drops the key', a.read('getPsk()') === '');
  ok('logout keeps the interval preference',
     a.read('localStorage.getItem("bravia-console-interval")') === '12');

  a.$('unlock-password').value = 'letmein';
  a.fire('unlock-form', 'submit');
  await waitFor(() => a.read('cfg') !== null, 'the second unlock');
  ok('a locally chosen interval outranks the packaged one', a.read('cfg').interval === 12);
  ok('key recovered again', a.read('getPsk()') === 'super-secret-psk');
  ok('an unlock with the box unchecked saves no password', saved() === null,
     a.read('JSON.stringify({...localStorage})'));

  /* ── stay signed in ───────────────────────────────────────── */
  await relock(a);
  ok('the box starts unchecked', a.$('unlock-remember').checked === false);
  await unlockAgain(a, 'letmein', true);
  const first = saved();
  ok('a checked box saves the password', first !== null);
  ok('what is saved is not the password in the clear',
     String(first).indexOf('letmein') === -1, first);
  ok('what is saved is the password behind five random characters',
     decodeSaved(first) === 'letmein', first);
  ok('neither address nor key is saved with it',
     String(first).indexOf('super-secret-psk') === -1 &&
     String(first).indexOf('127.0.0.1') === -1, first);

  /* Two visits must not settle on the same stored value, or the prefix is
     not random. */
  await relock(a);
  await unlockAgain(a, 'letmein', true);
  ok('the random prefix differs between visits', saved() !== first,
     first + ' then ' + saved());

  /* ── a remembered visit opens itself ────────────────────────────── */
  await reloadApp(a);
  await waitFor(() => a.read('cfg') !== null, 'the automatic unlock');
  ok('no password prompt on a remembered visit', !a.$('unlock-dialog').open);
  ok('the console is unlocked', a.read('locked') === false);
  ok('the key came back with nobody typing', a.read('getPsk()') === 'super-secret-psk');
  ok('the main screen is up', a.$('empty-state').hidden);
  ok('the saved password survives the visit it opened', saved() !== null);
  a.$('btn-settings').click();
  await waitFor(() => a.$('settings-dialog').open, 'settings on a remembered visit');
  ok('settings says the password is saved here', !a.$('deploy-remembered-note').hidden);
  ok('and drops the note about closing the tab', a.$('deploy-session-note').hidden);
  a.$('btn-cfg-cancel').click();
  await sleep(50);

  /* ── a saved password that is not the password ───────────────────── */
  setSaved(encodeSaved('not-the-password'));
  await reloadApp(a);
  await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open,
                'the prompt after a wrong saved password');
  ok('a wrong saved password falls back to the prompt', a.$('unlock-dialog').open);
  ok('the prompt reads as an ordinary first visit', a.$('unlock-error').hidden);
  ok('the box is unchecked again', a.$('unlock-remember').checked === false);
  ok('nothing was unlocked', a.read('cfg') === null && a.read('getPsk()') === '');
  ok('a wrong saved password is dropped', saved() === null,
     a.read('JSON.stringify({...localStorage})'));

  /* ── a saved value an attacker chose ────────────────────────────── */
  /* Every one of these is what a hand-edited store looks like: not base64,
     too short to hold the prefix and a password, valid base64 over bytes
     that are not UTF-8, and a prefix with nothing after it. Each has to
     land on the prompt rather than an exception. */
  const junk = ['not base64 at all!!', '=====', 'YQ==', 'AAAA', 'gIA=', 'gICAgIA=',
                encodeSaved(''), '\u0000\u0000', 'a'.repeat(4096)];
  for (const value of junk) {
    setSaved(value);
    await reloadApp(a);
    await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open,
                  'the prompt after ' + JSON.stringify(value.slice(0, 20)));
    ok('a junk saved password leaves the lock in place: ' + JSON.stringify(value.slice(0, 20)),
       a.$('unlock-dialog').open && a.read('cfg') === null);
  }

  /* ── logging out forgets the password ──────────────────────────── */
  await relock(a);
  await unlockAgain(a, 'letmein', true);
  ok('remembered before logging out', saved() !== null);
  a.$('btn-settings').click();
  await waitFor(() => a.$('settings-dialog').open, 'settings before logging out');
  a.$('btn-logout').click();
  await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open && a.read('cfg') === null,
                'the lock after logging out');
  ok('logout deletes the saved password', saved() === null,
     a.read('JSON.stringify({...localStorage})'));
  await sleep(400);
  ok('a logged-out page does not sign itself back in',
     a.$('unlock-dialog').open && a.read('cfg') === null);
});

/* ── the saved password, from outside the app ────────────────────── */

/* The suite page and the app share an origin, so what the app saves is
   readable here. These helpers speak the same format the app does, so a
   test can plant a value as well as read one back. */

const SAVED_KEY = 'bravia-console-remember';

/* Putting the same src back on an iframe navigates nowhere, and a test
   that believes it reloaded is a test that proves nothing, so every
   visit gets its own URL. The server ignores the query. Awaited, like
   every load here: the page arrives after the call, not during it. */
let visits = 0;
const reloadApp = (a) => a.load('/index.html?visit=' + (++visits));

const saved = () => localStorage.getItem(SAVED_KEY);
const setSaved = (value) => localStorage.setItem(SAVED_KEY, value);
const forgetSaved = () => localStorage.removeItem(SAVED_KEY);

function encodeSaved(password) {
  const bytes = new TextEncoder().encode('abcde' + password);
  let binary = '';
  for (const b of bytes) binary += String.fromCharCode(b);
  return btoa(binary);
}

function decodeSaved(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes.subarray(5));
}

/* Back to a freshly loaded, locked page with nothing saved. */
async function relock(a) {
  forgetSaved();
  await reloadApp(a);
  await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open, 'a fresh lock');
}

/* Unlock from whatever page is up, with the box in a chosen state. */
async function unlockAgain(a, password, remember) {
  await waitFor(() => a.$('unlock-dialog') && a.$('unlock-dialog').open, 'the prompt');
  a.$('unlock-remember').checked = !!remember;
  a.$('unlock-password').value = password;
  a.fire('unlock-form', 'submit');
  await waitFor(() => a.read('cfg') !== null, 'the unlock');
}
</script>
</body>
</html>
