version: 2

# Actions and the base image, which is the whole of it. The console itself has
# no dependencies and is not going to acquire any: what is in the repository is
# what runs in the browser, and the proxies are standard library on both
# runtimes. The cooldown is deliberate: nothing released in the last seven days
# is offered, because a version that young has had no time to be found wanting.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3

  # The base image the container is built on, pinned by digest in the
  # Dockerfile. A digest never moves on its own, so without this the image
  # would sit on whatever Debian and CPython shipped the day it was written.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3
