name: Release

# A tag and nothing else, so cutting a release is always deliberate and
# always has a version number attached to it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Three-way agreement. A release page naming a version the code never
      # claimed is a broken promise with a permalink, so this runs before
      # anything is published and the release job waits on it.
      - name: The tag, package.json and app.js must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          app="$(node -p "require('fs').readFileSync('app.js','utf8').match(/const APP_VERSION = '([^']+)'/)[1]")"
          echo "tag $tag / package.json $pkg / app.js $app"
          [ "$tag" = "$pkg" ] || { echo "tag does not match package.json" >&2; exit 1; }
          [ "$tag" = "$app" ] || { echo "tag does not match app.js" >&2; exit 1; }

      - name: Lint and unit tests
        run: |
          node tests/lint.js
          node tests/lockbox.test.js
          # The two implementations of the sealed format, checked against
          # each other. CI runs this too; the release runs it again
          # because lint.js only checks that seal.py parses, and a
          # divergence merged on a stale green run would publish
          # otherwise unchecked.
          node tests/seal.test.js

      - name: Build the archive
        run: node scripts/build.js

      - name: Unpack elsewhere and drive it
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/unpacked"
          node tests/run-browser.js --root "$RUNNER_TEMP/unpacked/$(ls "$RUNNER_TEMP/unpacked")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive
          path: dist/*.zip
          if-no-files-found: error

  docker:
    name: build and push the image
    needs: [build] # only once the versions are proved equal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR, through the token this job already has
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # QEMU is what makes the two arm legs possible on an x86 runner. They
      # stay quick because there is nothing to compile: the app is static files
      # and proxy.py is standard library only.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Work out the tags
        id: meta-ghcr
        # Both registries from one step, so the two can never be tagged
        # differently. The version comes from the tag, which the build job has
        # already checked against package.json and app.js.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
          # auto, not true: a prerelease tag such as v1.1.0-rc1 would
          # otherwise move `latest` onto it, and `latest` is what an
          # unqualified docker pull takes.
          flavor: latest=auto

      - name: Work out the Docker Hub tags
        id: meta-hub
        # The same rules against the other registry, so the two can never be
        # tagged differently.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
          flavor: latest=auto

      - name: The placeholder, and nothing else, goes in the image
        # A sealed deploy-config.js inside a published image hands the sealed
        # blob to anyone who can pull it, and registry layers outlive any
        # attempt to take it back. Checked here rather than trusted, because
        # the file is one `git add` away from being the wrong one.
        run: |
          grep -q 'BRAVIA_DEPLOY_CONFIG = null' deploy-config.js || {
            echo "::error::deploy-config.js is not the placeholder; refusing to publish"
            exit 1
          }

      - name: Build and push to GHCR
        # GHCR first, and on its own. It authenticates with the workflow's own
        # token, so it is the registry that cannot fail for want of a secret,
        # and a Docker Hub credential that has expired or been rotated must
        # not be able to take it down as well.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          provenance: true
          sbom: true

      - name: Log in to Docker Hub
        # After GHCR is safely published. A stored access token, and it needs
        # write access rather than only push, because the description step
        # below edits the repository.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        # The same build, from cache, retagged. It still fails the job loudly
        # if it goes wrong; what it can no longer do is prevent the GHCR push.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          provenance: true
          sbom: true

      - name: Put the README on the Docker Hub page
        # Docker Hub's overview is a field on the repository, not part of the
        # image, so neither the push nor the labels above reach it. GHCR needs
        # no equivalent: it reads the description off the image itself.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          readme-filepath: ./README.md

  release:
    # Behind the image as well as the build. The notes this lifts out of
    # CHANGELOG.md say the image is published to both registries on every
    # release, so cutting the release page while that job was failing would
    # announce a pull that answers "manifest unknown".
    needs: [build, docker] # only once the versions agree and the image is out
    runs-on: ubuntu-latest
    permissions:
      contents: write # nothing else, and no secret: github.token cuts a release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archive
          path: dist

      # The notes are the changelog section this release is named for, so
      # the page and the changelog cannot drift apart.
      - name: Take the notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0,h)==1 {p=1; next} p && index($0,"## [")==1 {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v" >&2; exit 1; }
          cat notes.md

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
