name: Release

# A tag and nothing else, so cutting a release is always deliberate and
# always has a version number attached to it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The check below walks the history, and the shallow fetch that
          # checkout does by default has none to walk.
          fetch-depth: 0
      - name: The tag must be on main
        # A squash merge writes a commit of its own, so a tag put on the
        # branch before the merge names a commit that never reaches main.
        # What was published is still fine, but the history stops saying so:
        # `git describe` on main answers with the release before this one, and
        # the release reads as though it never happened. Merge first, then tag
        # the commit that landed.
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not on main; merge first, then tag the commit that landed"
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Three-way agreement. A release page naming a version the code never
      # claimed is a broken promise with a permalink, so this runs before
      # anything is published and the release job waits on it.
      - name: The tag, package.json and app.js must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          app="$(node -p "require('fs').readFileSync('app.js','utf8').match(/const APP_VERSION = '([^']+)'/)[1]")"
          echo "tag $tag / package.json $pkg / app.js $app"
          [ "$tag" = "$pkg" ] || { echo "tag does not match package.json" >&2; exit 1; }
          [ "$tag" = "$app" ] || { echo "tag does not match app.js" >&2; exit 1; }

      - name: The placeholder, and nothing else, goes in the image
        # A sealed deploy-config.js inside a published image hands the sealed
        # blob to anyone who can pull it, and registry layers outlive any
        # attempt to take it back. Checked here rather than trusted, because
        # the file is one `git add` away from being the wrong one.
        #
        # In this job rather than beside the build that makes the image,
        # because the image jobs are calls to a shared workflow now and this
        # refusal belongs to this project rather than to the plumbing. They
        # wait on this job, so nothing is published before it has passed.
        # `node tests/lint.js` below asserts the same thing; this says it
        # where a reader looking for the guarantee will find it.
        run: |
          grep -q 'BRAVIA_DEPLOY_CONFIG = null' deploy-config.js || {
            echo "::error::deploy-config.js is not the placeholder; refusing to publish"
            exit 1
          }

      - name: Lint and unit tests
        run: |
          node tests/lint.js
          node tests/lockbox.test.js
          # The two implementations of the sealed format, checked against
          # each other. CI runs this too; the release runs it again
          # because lint.js only checks that seal.py parses, and a
          # divergence merged on a stale green run would publish
          # otherwise unchecked.
          node tests/seal.test.js

      - name: Build the archive
        run: node scripts/build.js

      - name: Unpack elsewhere and drive it
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/unpacked"
          node tests/run-browser.js --root "$RUNNER_TEMP/unpacked/$(ls "$RUNNER_TEMP/unpacked")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive
          path: dist/*.zip
          if-no-files-found: error

  docker:
    name: build and push the image
    # Behind `build`, and that is what keeps a sealed deploy-config.js out of
    # a published image: `build` lints, the lint refuses anything but the
    # placeholder, and nothing here runs until it has passed.
    needs: [build]
    permissions:
      contents: read
      packages: write        # GHCR, through the token this job already has
    uses: mjaksn/workflows/.github/workflows/publish-ghcr.yml@4e3dd222b30281d7c355286508542800ca5de33d

  docker-hub:
    name: mirror the image to Docker Hub
    # Called separately rather than as a second job inside the workflow above,
    # and that is the point of it. A called workflow succeeds only when every
    # job in it succeeds, so one call covering both registries would let a
    # Docker Hub outage hold up the release page waiting on `docker`. Apart,
    # a rotated token or an outage there costs Docker Hub and nothing else.
    needs: [build]
    uses: mjaksn/workflows/.github/workflows/mirror-dockerhub.yml@4e3dd222b30281d7c355286508542800ca5de33d
    secrets: inherit

  release:
    # Behind the image as well as the build. The notes this lifts out of
    # CHANGELOG.md say the image is published to both registries on every
    # release, so cutting the release page while that job was failing would
    # announce a pull that answers "manifest unknown". GHCR only: the
    # Docker Hub mirror is a separate job precisely so that its secret
    # cannot hold up the release.
    needs: [build, docker] # only once the versions agree and GHCR has the image
    runs-on: ubuntu-latest
    permissions:
      contents: write # nothing else, and no secret: github.token cuts a release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archive
          path: dist

      # The notes are the changelog section this release is named for, so
      # the page and the changelog cannot drift apart.
      - name: Take the notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0,h)==1 {p=1; next} p && index($0,"## [")==1 {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v" >&2; exit 1; }
          cat notes.md

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}